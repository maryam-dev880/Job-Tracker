{% extends 'applications/base.html' %}

{% block content %}
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Application</th>
                <th>Round Type</th>
                <th>Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for interviewround in interviewrounds %}
            <tr>
                <td>{{ interviewround.application }}</td>
                <td>{{ interviewround.round_type }}</td>
                <td>{{ interviewround.date|date:"d M Y, h:i A" }}</td>
                <td><a href="{% url 'edit_interviewround' interviewround.pk %}">Edit</a> | <a href="{% url 'delete_interviewround' interviewround.pk %}" onclick="return confirm('Are you sure you want to delete this interviewround?');">Delete</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
