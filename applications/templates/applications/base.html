<!DOCTYPE html>
<html>
<head>
    <title>JobTracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .nav-link:hover {
            color: #ffc107 !important;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand mb-0 h1">JobTracker</span>
            <a class="nav-link text-white d-inline" href="{% url 'application_list' %}">Applications</a>
            <a class="nav-link text-white d-inline" href="{% url 'dashboard' %}">Dashboard</a>
            <a class="nav-link text-white d-inline" href="{% url 'interviewround_list' %}">Interview Rounds</a>
            <a class="nav-link text-white d-inline" href="{% url 'add_application' %}">Add Application</a>
            <form method="post" action="{% url 'logout' %}" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-link nav-link text-white d-inline" style="border:none;">Logout</button>
            </form>
        </div>
    </nav>
    {% block content %}
    {% endblock %}
</body>
</html>
